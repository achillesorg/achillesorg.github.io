<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#141613">
  <meta name="description" content="Achilles — an open-source software organization.">
  <title>Achilles — Open-source software</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#141613;color:#f0eee6}
    *{box-sizing:border-box}body{margin:0;min-height:100svh;display:flex;flex-direction:column}
    a{color:inherit}header{padding:2.2rem clamp(1.5rem,6vw,5rem);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #34362f}
    .brand{font-size:1.05rem;font-weight:750;letter-spacing:-.04em}.brand:before{content:"◢";color:#a8b497;margin-right:.75rem}header a{font-size:.86rem;text-decoration:none;color:#c2c8b7}
    main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:7rem clamp(1.5rem,12vw,11rem)}
    .eyebrow{font-size:.8rem;letter-spacing:.15em;text-transform:uppercase;color:#a8b497;font-weight:700}
    h1{font-size:clamp(4.5rem,11vw,11rem);line-height:.96;letter-spacing:-.085em;font-weight:750;margin:1.2rem 0}
    p{max-width:39rem;font-size:clamp(1.1rem,2.3vw,1.45rem);line-height:1.65;color:#b4b7ad;margin:1rem 0 2.5rem}
    .button{display:inline-flex;align-items:center;gap:1.2rem;align-self:start;padding:.9rem 1.35rem;border:1px solid #747d6b;border-radius:7px;text-decoration:none;font-size:.93rem;transition:background .2s}
    .button:hover{background:#292d26}.button span{font-size:1.3rem}
    footer{display:flex;justify-content:space-between;flex-wrap:wrap;gap:1rem;padding:1.5rem clamp(1.5rem,6vw,5rem);border-top:1px solid #34362f;color:#8f9687;font-size:.8rem}
    @media(prefers-reduced-motion:reduce){.button{transition:none}}
  </style>
</head>
<body>
<header><div class="brand">Achilles</div><a href="https://github.com/achillesorg">GitHub ↗</a></header>
<main><div class="eyebrow">Open source · Built to last</div><h1>Achilles<span style="color:#9fae93">.</span></h1><p>Exploring ideas, building software, and sharing our work with the world.</p><a class="button" href="https://github.com/achillesorg">Explore our projects <span aria-hidden="true">↗</span></a></main>
<footer><span>© Achilles</span><span>Made in the open.</span></footer>
</body>
</html>
